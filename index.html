<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Zaman Kaşifi — Çocuklar için interaktif ve eğlenceli analog saat öğrenme oyunu">
  <meta name="theme-color" content="#4FC3F7">
  <title>Zaman Kaşifi ⏰ Macera Başlıyor!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="game-wrapper" data-time-period="morning">

    <!-- ===== OYUN ÜST PANELİ (Header & Stats) ===== -->
    <header class="game-header">
      <div class="logo-badge">
        <span class="logo-icon">⏰</span>
        <div class="logo-text">
          <span class="app-title">ZAMAN KAŞİFİ</span>
          <span class="app-subtitle">Saatleri Keşfet</span>
        </div>
      </div>

      <div class="stats-group">
        <!-- Yıldız / Puan Rozeti -->
        <div class="stat-pill star-pill" title="Toplam Doğru">
          <div class="pill-icon">⭐</div>
          <span id="total-correct" class="pill-value">0</span>
        </div>

        <!-- Seri (Streak) Rozeti -->
        <div class="stat-pill streak-pill" title="Arka Arkaya Doğru Serisi">
          <div class="pill-icon fire-icon">🔥</div>
          <span id="current-streak" class="pill-value">0</span>
        </div>

        <!-- Ödül Hedefi İlerleme Çubuğu -->
        <div class="reward-progress-box" title="Sonraki Ödüle Kalan">
          <div class="reward-goal-icon" id="next-reward-icon">🌳</div>
          <div class="progress-track">
            <div id="reward-progress-bar" class="progress-fill" style="width: 0%"></div>
          </div>
          <span id="reward-progress-text" class="progress-text">0/5</span>
        </div>
      </div>
    </header>

    <!-- ===== ANA OYUN ALANI (Masaüstünde 2 Sütun, Mobilde Akıcı Sıralama) ===== -->
    <main class="game-main-content">

      <!-- SOL / ÜST SÜTUN: Masalsı Sahne & Analog Saat -->
      <section class="visual-stage-card">

        <!-- DİNAMİK CANLI SVG SAHNE -->
        <div class="scene-viewport" aria-label="Canlı masal dünyası">
          <svg id="scene" viewBox="0 0 500 240" preserveAspectRatio="xMidYMid slice" role="img">
            <defs>
              <!-- Gökyüzü Renk Geçişleri -->
              <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop id="skyStop1" offset="0%" stop-color="var(--sky-1)" />
                <stop id="skyStop2" offset="100%" stop-color="var(--sky-2)" />
              </linearGradient>

              <!-- Güneş Parıltısı -->
              <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFE082" stop-opacity="1" />
                <stop offset="60%" stop-color="#FFD54F" stop-opacity="0.5" />
                <stop offset="100%" stop-color="#FFCA28" stop-opacity="0" />
              </radialGradient>

              <!-- Balon Çizgileri -->
              <linearGradient id="balloonPattern" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#FF5252" />
                <stop offset="33%" stop-color="#FFD740" />
                <stop offset="66%" stop-color="#448AFF" />
                <stop offset="100%" stop-color="#69F0AE" />
              </linearGradient>

              <!-- Yumuşak Tepe Gölgeleri -->
              <linearGradient id="hillBackGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--hill-back-1)" />
                <stop offset="100%" stop-color="var(--hill-back-2)" />
              </linearGradient>
              <linearGradient id="hillFrontGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--hill-front-1)" />
                <stop offset="100%" stop-color="var(--hill-front-2)" />
              </linearGradient>
            </defs>

            <!-- Gökyüzü Arka Planı -->
            <rect width="500" height="240" fill="url(#skyGrad)" />

            <!-- Yıldızlar ve Işıltılar (Gece aktif) -->
            <g id="stars" class="scene-anim-stars" opacity="0">
              <circle cx="45" cy="35" r="2" fill="#FFFDE7" />
              <circle cx="85" cy="20" r="1.5" fill="#FFF9C4" />
              <circle cx="130" cy="50" r="2.2" fill="#FFFDE7" />
              <polygon points="175,25 177,30 182,31 178,34 179,39 175,36 171,39 172,34 168,31 173,30" fill="#FFF59D" />
              <circle cx="215" cy="40" r="1.5" fill="#FFFDE7" />
              <circle cx="280" cy="25" r="2" fill="#FFF" />
              <polygon points="340,30 342,34 346,35 343,38 344,42 340,39 336,42 337,38 334,35 338,34" fill="#FFF59D" />
              <circle cx="395" cy="45" r="1.8" fill="#FFFDE7" />
              <circle cx="450" cy="25" r="2.2" fill="#FFF" />
              <circle cx="475" cy="65" r="1.5" fill="#FFF9C4" />
            </g>

            <!-- Güneş (Etkileşimli & Sevimli Yüzlü) -->
            <g id="sun" class="celestial-body interactive-element" transform="translate(100, 60)">
              <circle class="sun-halo" cx="0" cy="0" r="46" fill="url(#sunAura)" />
              <circle class="sun-core" cx="0" cy="0" r="24" fill="#FFC107" />
              <!-- Güneş Sevimli Yüz -->
              <g id="sun-face">
                <circle cx="-7" cy="-4" r="2.5" fill="#D84315" />
                <circle cx="7" cy="-4" r="2.5" fill="#D84315" />
                <ellipse cx="-11" cy="2" rx="3" ry="1.5" fill="#FF8A65" opacity="0.8" />
                <ellipse cx="11" cy="2" rx="3" ry="1.5" fill="#FF8A65" opacity="0.8" />
                <path d="M-6,4 Q0,11 6,4" fill="none" stroke="#D84315" stroke-width="2.2" stroke-linecap="round" />
              </g>
            </g>

            <!-- Ay (Hilal & Gece Arkadaşı) -->
            <g id="moon" class="celestial-body interactive-element" transform="translate(380, 55)" opacity="0">
              <circle cx="0" cy="0" r="22" fill="#FFF59D" />
              <circle cx="8" cy="-5" r="18" fill="var(--sky-1)" />
              <!-- Ay Sevimli Yüz -->
              <g id="moon-face">
                <circle cx="-5" cy="-2" r="2" fill="#9E9D24" />
                <ellipse cx="-8" cy="4" rx="2.5" ry="1.2" fill="#F0F4C3" />
                <path d="M-8,5 Q-3,10 2,5" fill="none" stroke="#9E9D24" stroke-width="1.8" stroke-linecap="round" />
              </g>
            </g>

            <!-- Pofuduk Bulutlar -->
            <g id="clouds" class="interactive-element">
              <g class="cloud cloud-a" transform="translate(70, 75)">
                <ellipse cx="0" cy="0" rx="30" ry="14" fill="#FFFFFF" opacity="0.95" />
                <ellipse cx="20" cy="-4" rx="22" ry="12" fill="#FFFFFF" opacity="0.95" />
                <ellipse cx="-18" cy="2" rx="18" ry="10" fill="#FFFFFF" opacity="0.95" />
              </g>
              <g class="cloud cloud-b" transform="translate(350, 90)">
                <ellipse cx="0" cy="0" rx="26" ry="12" fill="#FFFFFF" opacity="0.88" />
                <ellipse cx="16" cy="-3" rx="18" ry="10" fill="#FFFFFF" opacity="0.88" />
                <ellipse cx="-14" cy="2" rx="16" ry="9" fill="#FFFFFF" opacity="0.88" />
              </g>
            </g>

            <!-- Arka Tepeler -->
            <path d="M-20,240 Q100,140 240,190 T520,180 L520,240 Z" fill="url(#hillBackGrad)" />

            <!-- Ön Tepe ve Çayır -->
            <path d="M-20,240 Q120,170 300,205 T520,210 L520,240 Z" fill="url(#hillFrontGrad)" />

            <!-- Sevimli Masal Evi -->
            <g id="house" class="interactive-element" transform="translate(240, 150)">
              <!-- Baca -->
              <rect x="22" y="-38" width="16" height="26" rx="3" fill="#8D6E63" />
              <rect x="19" y="-42" width="22" height="6" rx="2" fill="#6D4C41" />
              <!-- Baca Puf Dumanları (10 doğruda açılır) -->
              <g id="chimney-smoke" class="smoke-puff-group" opacity="0">
                <circle class="smoke-puff p1" cx="30" cy="-52" r="5" fill="#FFFFFF" opacity="0.7" />
                <circle class="smoke-puff p2" cx="34" cy="-66" r="7" fill="#FFFFFF" opacity="0.5" />
                <circle class="smoke-puff p3" cx="28" cy="-80" r="9" fill="#FFFFFF" opacity="0.3" />
              </g>

              <!-- Ev Gövdesi (Tatlı Kır Evi) -->
              <rect x="-48" y="0" width="96" height="74" rx="6" fill="var(--house-body)" stroke="#5D4037" stroke-width="2" />
              
              <!-- Üçgen Ahşap Çatı -->
              <polygon points="-58,-2 0,-44 58,-2" fill="var(--house-roof)" stroke="#3E2723" stroke-width="2" />
              <!-- Çatı Çatı Süsü -->
              <circle cx="0" cy="-20" r="7" fill="#FFECB3" stroke="#8D6E63" stroke-width="1.5" />

              <!-- Yuvarlak Kemeri Olan Sevimli Kapı -->
              <path d="M-12,74 L-12,46 Q0,32 12,46 L12,74 Z" fill="var(--house-door)" stroke="#4E342E" stroke-width="2" />
              <circle cx="7" cy="56" r="2.5" fill="#FFD54F" />

              <!-- Sol Pencere (Pancurlu ve Işıklı) -->
              <g id="window-left" transform="translate(-36, 16)">
                <rect x="0" y="0" width="22" height="22" rx="4" fill="var(--window-light)" stroke="#FFF" stroke-width="2" />
                <line x1="11" y1="0" x2="11" y2="22" stroke="#FFF" stroke-width="1.5" />
                <line x1="0" y1="11" x2="22" y2="11" stroke="#FFF" stroke-width="1.5" />
              </g>

              <!-- Sağ Pencere -->
              <g id="window-right" transform="translate(14, 16)">
                <rect x="0" y="0" width="22" height="22" rx="4" fill="var(--window-light)" stroke="#FFF" stroke-width="2" />
                <line x1="11" y1="0" x2="11" y2="22" stroke="#FFF" stroke-width="1.5" />
                <line x1="0" y1="11" x2="22" y2="11" stroke="#FFF" stroke-width="1.5" />
              </g>
            </g>

            <!-- === AÇILABİLİR KALICI ÖDÜLLER === -->

            <!-- 5 Doğru: Meyveli Sevimli Ağaç -->
            <g id="reward-tree" class="reward-item" opacity="0" transform="translate(115, 175)">
              <rect x="-6" y="5" width="12" height="35" rx="3" fill="#6D4C41" />
              <!-- Ağaç Taç Yaprakları -->
              <circle cx="0" cy="-6" r="24" fill="#66BB6A" />
              <circle cx="-14" cy="4" r="16" fill="#4CAF50" />
              <circle cx="14" cy="4" r="16" fill="#43A047" />
              <!-- Kırmızı Elmalar -->
              <circle cx="-6" cy="-8" r="3.5" fill="#E53935" />
              <circle cx="8" cy="-2" r="3.5" fill="#E53935" />
              <circle cx="-4" cy="10" r="3.5" fill="#E53935" />
            </g>

            <!-- 15 Doğru: Sıcak Hava Balonu -->
            <g id="reward-balloon" class="reward-item" opacity="0" transform="translate(420, 95)">
              <!-- Balon Gövdesi -->
              <ellipse cx="0" cy="-18" rx="18" ry="24" fill="url(#balloonPattern)" stroke="#FFF" stroke-width="1.5" />
              <!-- İpler ve Sepet -->
              <line x1="-7" y1="6" x2="-4" y2="15" stroke="#795548" stroke-width="1.2" />
              <line x1="7" y1="6" x2="4" y2="15" stroke="#795548" stroke-width="1.2" />
              <rect x="-6" y="15" width="12" height="9" rx="2" fill="#8D6E63" stroke="#5D4037" stroke-width="1" />
            </g>

            <!-- 20 Doğru: Sevimli Köpek ve Kulübesi -->
            <g id="reward-doghouse" class="reward-item" opacity="0" transform="translate(370, 195)">
              <!-- Kulübe -->
              <rect x="-20" y="-8" width="40" height="32" rx="3" fill="#D87A4F" stroke="#8D381B" stroke-width="1.5" />
              <polygon points="-25,-8 0,-26 25,-8" fill="#A84320" stroke="#66200A" stroke-width="1.5" />
              <!-- Kapı Açıklığı -->
              <ellipse cx="0" cy="11" rx="9" ry="12" fill="#3E2723" />
              <!-- Sevimli Köpek (Kulübenin Önünde) -->
              <g transform="translate(-18, 12)">
                <ellipse cx="0" cy="0" rx="9" ry="7" fill="#F5BA82" />
                <circle cx="-5" cy="-7" r="6" fill="#F5BA82" />
                <circle cx="-7" cy="-8" r="1.8" fill="#3E2723" />
                <ellipse cx="-9" cy="-6" rx="2" ry="1.5" fill="#FF7043" />
                <ellipse cx="1" cy="-12" rx="3" ry="5" fill="#C98A4E" transform="rotate(20)" />
                <!-- Kemik / Tasma -->
                <circle cx="-2" cy="-2" r="2.5" fill="#E53935" />
              </g>
            </g>

          </svg>
        </div>

        <!-- OYUNCAKSI VE SEVİMLİ MODERN ANALOG SAAT -->
        <div class="clock-display-card">
          <div id="clock-wrapper" class="clock-3d-wrapper">
            <svg id="analog-clock" viewBox="0 0 240 240" role="img" aria-label="Analog Saat Kadranı">
              <defs>
                <!-- Dış Çerçeve 3D Gradyanı -->
                <linearGradient id="clockBezelGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#FFFFFF" />
                  <stop offset="35%" stop-color="#E2E8F0" />
                  <stop offset="100%" stop-color="#CBD5E1" />
                </linearGradient>

                <!-- Kadran İç Derinlik Gradyanı -->
                <radialGradient id="clockFaceGrad" cx="50%" cy="50%" r="50%">
                  <stop offset="85%" stop-color="#FFFFFF" />
                  <stop offset="100%" stop-color="#F1F5F9" />
                </radialGradient>

                <!-- Akrep ve Yelkovan Yumuşak Gölgeleri -->
                <filter id="handShadow" x="-20%" y="-20%" width="150%" height="150%">
                  <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.25" />
                </filter>
              </defs>

              <!-- Dış Kalın Bezel / Saat Kasası -->
              <circle id="clock-bezel" cx="120" cy="120" r="114" fill="url(#clockBezelGrad)" stroke="var(--bezel-border)" stroke-width="4" />
              
              <!-- İç Altın Halka (Streak 3+ olunca parıldar) -->
              <circle id="clock-gold-rim" cx="120" cy="120" r="106" fill="none" stroke="transparent" stroke-width="4" />

              <!-- Kadran Gövdesi -->
              <circle cx="120" cy="120" r="104" fill="url(#clockFaceGrad)" />

              <!-- 60 Dakika Çentikleri -->
              <g id="minute-ticks"></g>

              <!-- Gizli 5'er Dakikalık İpucu Sayıları (05, 10, 15...) -->
              <g id="minute-labels" class="minute-hint-labels" opacity="0"></g>

              <!-- 1'den 12'ye Saat Sayıları -->
              <g id="hour-numbers" class="clock-numbers-group"></g>

              <!-- AKREP: Tombul, Lacivert/Mor Kapsül -->
              <g id="hour-hand-group" class="clock-hand" filter="url(#handShadow)">
                <line id="hour-hand" x1="120" y1="120" x2="120" y2="58" stroke="var(--hand-hour-color)" stroke-width="9" stroke-linecap="round" />
                <circle cx="120" cy="58" r="3" fill="#FFFFFF" opacity="0.8" />
              </g>

              <!-- YELKOVAN: Canlı Mercan/Turuncu Zarif Ok -->
              <g id="minute-hand-group" class="clock-hand" filter="url(#handShadow)">
                <line id="minute-hand" x1="120" y1="128" x2="120" y2="30" stroke="var(--hand-minute-color)" stroke-width="5.5" stroke-linecap="round" />
                <!-- Yelkovan ucu minik ok başlığı -->
                <polygon points="120,22 115,34 125,34" fill="var(--hand-minute-color)" />
              </g>

              <!-- Orta Pivot / Göbek Düğmesi -->
              <circle cx="120" cy="120" r="8" fill="#1E293B" />
              <circle cx="120" cy="120" r="4" fill="#F8FAFC" />
            </svg>
          </div>

          <!-- Saat Altı Küçük Bilgi Rozetleri (Akrep = Saat, Yelkovan = Dakika) -->
          <div class="clock-legend">
            <span class="legend-badge hour-badge"><span class="badge-dot dot-hour"></span> Akrep (Saat)</span>
            <span class="legend-badge min-badge"><span class="badge-dot dot-min"></span> Yelkovan (Dakika)</span>
          </div>
        </div>

      </section>

      <!-- SAĞ / ALT SÜTUN: Görev Hikayesi & Yanıt Alanı -->
      <section class="question-action-card">

        <!-- Görev / Hikaye Balonu -->
        <div class="speech-bubble-container">
          <div class="mascot-avatar" id="mascot-face">🦉</div>
          <div class="speech-bubble">
            <p id="story-text" class="story-text">Günün saati yükleniyor...</p>
            <h2 id="question-text" class="question-title">Bu saat kaçı gösteriyor?</h2>
          </div>
        </div>

        <!-- ==============================================
             SORU TİPİ 1: iOS Tarzı 3D Wheel Picker
             ============================================== -->
        <div id="wheel-picker-area" class="interactive-mode-box" style="display:none">
          <div class="wheel-picker-card">
            
            <!-- Saat Çarkı -->
            <div class="wheel-box">
              <span class="wheel-header">SAAT (00-23)</span>
              <div class="wheel-viewport" id="hour-wheel-viewport">
                <div class="wheel-glass-highlight"></div>
                <div class="wheel-track" id="hour-wheel-track" role="listbox"></div>
              </div>
            </div>

            <!-- Ortadaki İki Nokta -->
            <div class="wheel-colon-box">
              <span class="wheel-colon">:</span>
            </div>

            <!-- Dakika Çarkı -->
            <div class="wheel-box">
              <span class="wheel-header">DAKİKA (00-55)</span>
              <div class="wheel-viewport" id="minute-wheel-viewport">
                <div class="wheel-glass-highlight"></div>
                <div class="wheel-track" id="minute-wheel-track" role="listbox"></div>
              </div>
            </div>

          </div>

          <!-- 3D Büyük Buton -->
          <button id="submit-wheel" class="bouncy-btn btn-success" type="button">
            <span class="btn-icon">✨</span>
            <span class="btn-label">Cevabımı Kontrol Et</span>
          </button>
        </div>

        <!-- ==============================================
             SORU TİPİ 2: 4 Renkli Çoktan Seçmeli Kart
             ============================================== -->
        <div id="multiple-choice-area" class="interactive-mode-box" style="display:none">
          <div id="choices-grid" class="choices-grid">
            <!-- JavaScript dinamik butonları (A, B, C, D) oluşturur -->
          </div>
        </div>

        <!-- Geri Bildirim Alanı (Doğru / Yanlış / İpucu) -->
        <div id="feedback-area" class="feedback-container">
          <div id="feedback-message" class="feedback-banner"></div>
          <button id="next-question-btn" class="bouncy-btn btn-primary next-btn" style="display:none" type="button">
            <span class="btn-label">Sonraki Göreve Geç</span>
            <span class="btn-icon">🚀</span>
          </button>
        </div>

      </section>

    </main>

  </div>

  <!-- Scriptler: Sıfır build aracı, doğrudan %100 yerel ve GitHub Pages uyumlu -->
  <script src="js/turkishTimeEngine.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
