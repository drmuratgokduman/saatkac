<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Zaman Kaşifi — Çocuklar için interaktif ve eğlenceli analog saat öğrenme oyunu">
  <meta name="theme-color" content="#38BDF8">
  <title>Zaman Kaşifi ⏰ Macera Başlıyor!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="game-wrapper" data-time-period="morning">

    <!-- ===== 1. ÜST PANEL: Logo, Puan ve İlerleme ===== -->
    <header class="game-header">
      <div class="logo-badge">
        <span class="logo-icon">⏰</span>
        <div class="logo-text">
          <span class="app-title">ZAMAN KAŞİFİ</span>
          <span class="app-subtitle">Analog Saat Macerası</span>
        </div>
      </div>

      <div class="stats-group">
        <!-- Doğru Sayısı -->
        <div class="stat-pill star-pill" title="Toplam Doğru">
          <span class="pill-icon">⭐</span>
          <span id="total-correct" class="pill-value">0</span>
        </div>

        <!-- Seri (Streak) -->
        <div class="stat-pill streak-pill" title="Arka Arkaya Doğru Serisi">
          <span class="pill-icon fire-icon">🔥</span>
          <span id="current-streak" class="pill-value">0</span>
        </div>

        <!-- Sonraki Ödül Hedefi -->
        <div class="reward-progress-box" title="Sonraki Ödül">
          <span class="reward-goal-icon" id="next-reward-icon">🌳</span>
          <div class="progress-track">
            <div id="reward-progress-bar" class="progress-fill" style="width: 0%"></div>
          </div>
          <span id="reward-progress-text" class="progress-text">0/5</span>
        </div>
      </div>
    </header>

    <!-- ===== 2. YENİDEN TASARLANAN MASALSI MANZARA SAHNESİ ===== -->
    <section class="scene-stage-container">
      <div class="scene-viewport" aria-label="Canlı masal dünyası">
        
        <!-- VAKİT ROZETİ (GÖRSELİN TAM ORTASINDA) -->
        <div class="time-period-badge" id="time-period-indicator">
          <span class="period-icon" id="period-icon">☀️</span>
          <span class="period-label" id="period-label">SABAH</span>
        </div>

        <svg id="scene" viewBox="0 0 500 170" preserveAspectRatio="xMidYMid meet" role="img">
          <defs>
            <!-- Gökyüzü Degradesi -->
            <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop id="skyStop1" offset="0%" stop-color="var(--sky-1)" />
              <stop id="skyStop2" offset="100%" stop-color="var(--sky-2)" />
            </linearGradient>

            <!-- Güneş Işığı Halesi -->
            <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFE082" stop-opacity="1" />
              <stop offset="50%" stop-color="#FFD54F" stop-opacity="0.5" />
              <stop offset="100%" stop-color="#FFCA28" stop-opacity="0" />
            </radialGradient>

            <!-- Arka Dağlar Degradesi -->
            <linearGradient id="mountainsGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--mountain-top)" />
              <stop offset="100%" stop-color="var(--mountain-base)" />
            </linearGradient>

            <!-- Ön Yeşil Tepe Degradesi -->
            <linearGradient id="frontHillsGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--hill-1)" />
              <stop offset="100%" stop-color="var(--hill-2)" />
            </linearGradient>

            <!-- Sıcak Hava Balonu Şeritleri -->
            <linearGradient id="balloonGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#FF5252" />
              <stop offset="33%" stop-color="#FFD740" />
              <stop offset="66%" stop-color="#448AFF" />
              <stop offset="100%" stop-color="#69F0AE" />
            </linearGradient>
          </defs>

          <!-- 1. Gökyüzü -->
          <rect width="500" height="170" fill="url(#skyGrad)" />

          <!-- 2. Yıldızlar (Gece Aktif) -->
          <g id="stars" class="scene-anim-stars" opacity="0">
            <circle cx="35" cy="25" r="1.5" fill="#FFFDE7" />
            <circle cx="75" cy="40" r="1.2" fill="#FFF9C4" />
            <polygon points="120,20 122,24 126,25 123,28 124,32 120,29 116,32 117,28 114,25 118,24" fill="#FFFDE7" />
            <circle cx="165" cy="35" r="1.8" fill="#FFF" />
            <circle cx="210" cy="18" r="1.2" fill="#FFFDE7" />
            <polygon points="310,22 312,26 316,27 313,30 314,34 310,31 306,34 307,30 304,27 308,26" fill="#FFFDE7" />
            <circle cx="380" cy="35" r="1.5" fill="#FFF" />
            <circle cx="435" cy="20" r="1.8" fill="#FFFDE7" />
            <circle cx="470" cy="45" r="1.2" fill="#FFF9C4" />
          </g>

          <!-- 3. Güneş (Sevimli & Işıltılı) -->
          <g id="sun" class="celestial-body interactive-element" transform="translate(90, 48)">
            <circle class="sun-glow" cx="0" cy="0" r="38" fill="url(#sunGlow)" />
            <circle class="sun-core" cx="0" cy="0" r="20" fill="#FFC107" />
            <!-- Sevimli Güneş Yüzü -->
            <g id="sun-face">
              <circle cx="-6" cy="-3" r="2.2" fill="#D84315" />
              <circle cx="6" cy="-3" r="2.2" fill="#D84315" />
              <ellipse cx="-9" cy="2" rx="2.5" ry="1.2" fill="#FF8A65" opacity="0.85" />
              <ellipse cx="9" cy="2" rx="2.5" ry="1.2" fill="#FF8A65" opacity="0.85" />
              <path d="M-5,4 Q0,9 5,4" fill="none" stroke="#D84315" stroke-width="2" stroke-linecap="round" />
            </g>
          </g>

          <!-- 4. Hilal Ay (Gece) -->
          <g id="moon" class="celestial-body interactive-element" transform="translate(410, 42)" opacity="0">
            <circle cx="0" cy="0" r="18" fill="#FFF59D" />
            <circle cx="7" cy="-4" r="15" fill="var(--sky-1)" />
            <g id="moon-face">
              <circle cx="-4" cy="-2" r="1.8" fill="#9E9D24" />
              <ellipse cx="-7" cy="3" rx="2" ry="1" fill="#F0F4C3" />
              <path d="M-6,4 Q-2,8 2,4" fill="none" stroke="#9E9D24" stroke-width="1.5" stroke-linecap="round" />
            </g>
          </g>

          <!-- 5. Yumuşak Bulutlar -->
          <g id="clouds" class="interactive-element">
            <g class="cloud cloud-a" transform="translate(60, 60)">
              <ellipse cx="0" cy="0" rx="26" ry="11" fill="#FFFFFF" opacity="0.95" />
              <ellipse cx="16" cy="-3" rx="18" ry="9" fill="#FFFFFF" opacity="0.95" />
              <ellipse cx="-14" cy="2" rx="14" ry="8" fill="#FFFFFF" opacity="0.95" />
            </g>
            <g class="cloud cloud-b" transform="translate(390, 70)">
              <ellipse cx="0" cy="0" rx="24" ry="10" fill="#FFFFFF" opacity="0.9" />
              <ellipse cx="14" cy="-3" rx="16" ry="8" fill="#FFFFFF" opacity="0.9" />
              <ellipse cx="-12" cy="2" rx="14" ry="7" fill="#FFFFFF" opacity="0.9" />
            </g>
          </g>

          <!-- 6. Arka Sisli Dağ Siluetleri -->
          <path d="M-20,170 L50,105 L130,135 L220,95 L310,130 L400,100 L490,135 L520,170 Z" fill="url(#mountainsGrad)" />

          <!-- 7. Ön Dalgalı Yeşil Tepe -->
          <path d="M-20,170 Q110,115 250,138 T520,140 L520,170 Z" fill="url(#frontHillsGrad)" />

          <!-- Çam Ağaçları (Estetik İskandinav İllüstrasyonu) -->
          <g transform="translate(60, 115)">
            <polygon points="0,-24 -9,-8 9,-8" fill="var(--pine-1)" />
            <polygon points="0,-16 -12,0 12,0" fill="var(--pine-2)" />
            <polygon points="0,-8 -14,10 14,10" fill="var(--pine-3)" />
            <rect x="-2" y="10" width="4" height="8" fill="#5D4037" />
          </g>
          <g transform="translate(430, 120)">
            <polygon points="0,-20 -8,-6 8,-6" fill="var(--pine-1)" />
            <polygon points="0,-13 -10,2 10,2" fill="var(--pine-2)" />
            <polygon points="0,-5 -12,10 12,10" fill="var(--pine-3)" />
            <rect x="-2" y="10" width="4" height="6" fill="#5D4037" />
          </g>

          <!-- 8. YENİ SEVİMLİ İSKANDİNAV MASAL KULÜBESİ -->
          <g id="house" class="interactive-element" transform="translate(250, 108)">
            <!-- Taş Temel -->
            <rect x="-38" y="32" width="76" height="12" rx="2" fill="#78909C" />

            <!-- Ahşap Kulübe Gövdesi -->
            <rect x="-34" y="2" width="68" height="32" rx="4" fill="var(--cottage-body)" stroke="#4527A0" stroke-width="1.5" />

            <!-- Dik Üçgen Koyu Çatı -->
            <polygon points="-44,6 0,-34 44,6" fill="var(--cottage-roof)" stroke="#311B92" stroke-width="2" />

            <!-- Çatı Taş Bacası -->
            <rect x="18" y="-28" width="12" height="20" rx="2" fill="#8D6E63" />
            <rect x="16" y="-31" width="16" height="5" rx="1.5" fill="#5D4037" />

            <!-- Baca Duman Pıfları (10 doğruda açılır) -->
            <g id="chimney-smoke" class="smoke-puff-group" opacity="0">
              <circle class="smoke-puff p1" cx="24" cy="-40" r="4" fill="#FFFFFF" opacity="0.75" />
              <circle class="smoke-puff p2" cx="28" cy="-52" r="5.5" fill="#FFFFFF" opacity="0.5" />
              <circle class="smoke-puff p3" cx="22" cy="-64" r="7" fill="#FFFFFF" opacity="0.3" />
            </g>

            <!-- Yuvarlak Sıcak Işıklı Tavan Penceresi -->
            <circle cx="0" cy="-12" r="9" fill="var(--window-warm)" stroke="#FFFFFF" stroke-width="1.8" />
            <line x1="0" y1="-21" x2="0" y2="-3" stroke="#FFFFFF" stroke-width="1.2" />
            <line x1="-9" y1="-12" x2="9" y2="-12" stroke="#FFFFFF" stroke-width="1.2" />

            <!-- Ahşap Kemerli Kapı -->
            <path d="M-8,34 L-8,14 Q0,4 8,14 L8,34 Z" fill="var(--cottage-door)" stroke="#3E2723" stroke-width="1.5" />
            <circle cx="4" cy="22" r="1.8" fill="#FFD54F" />

            <!-- Ön Sol Pencere -->
            <g id="window-left" transform="translate(-27, 10)">
              <rect x="0" y="0" width="14" height="14" rx="3" fill="var(--window-warm)" stroke="#FFFFFF" stroke-width="1.5" />
              <line x1="7" y1="0" x2="7" y2="14" stroke="#FFFFFF" stroke-width="1" />
              <line x1="0" y1="7" x2="14" y2="7" stroke="#FFFFFF" stroke-width="1" />
            </g>

            <!-- Ön Sağ Pencere -->
            <g id="window-right" transform="translate(13, 10)">
              <rect x="0" y="0" width="14" height="14" rx="3" fill="var(--window-warm)" stroke="#FFFFFF" stroke-width="1.5" />
              <line x1="7" y1="0" x2="7" y2="14" stroke="#FFFFFF" stroke-width="1" />
              <line x1="0" y1="7" x2="14" y2="7" stroke="#FFFFFF" stroke-width="1" />
            </g>
          </g>

          <!-- 9. AÇILABİLİR KALICI ÖDÜLLER -->

          <!-- 5 Doğru: Meyveli Elma Ağacı -->
          <g id="reward-tree" class="reward-item" opacity="0" transform="translate(130, 130)">
            <rect x="-4" y="0" width="8" height="24" rx="2" fill="#6D4C41" />
            <circle cx="0" cy="-8" r="18" fill="#4CAF50" />
            <circle cx="-10" cy="0" r="12" fill="#66BB6A" />
            <circle cx="10" cy="0" r="12" fill="#43A047" />
            <circle cx="-4" cy="-9" r="2.8" fill="#E53935" />
            <circle cx="6" cy="-4" r="2.8" fill="#E53935" />
            <circle cx="-2" cy="4" r="2.8" fill="#E53935" />
          </g>

          <!-- 15 Doğru: Sıcak Hava Balonu -->
          <g id="reward-balloon" class="reward-item" opacity="0" transform="translate(340, 55)">
            <ellipse cx="0" cy="-14" rx="14" ry="18" fill="url(#balloonGrad)" stroke="#FFF" stroke-width="1.2" />
            <line x1="-5" y1="4" x2="-3" y2="11" stroke="#795548" stroke-width="1" />
            <line x1="5" y1="4" x2="3" y2="11" stroke="#795548" stroke-width="1" />
            <rect x="-5" y="11" width="10" height="7" rx="1.5" fill="#8D6E63" />
          </g>

          <!-- 20 Doğru: Sevimli Köpek Kulübesi -->
          <g id="reward-doghouse" class="reward-item" opacity="0" transform="translate(365, 140)">
            <rect x="-14" y="-6" width="28" height="22" rx="2" fill="#D87A4F" stroke="#8D381B" stroke-width="1.2" />
            <polygon points="-18,-6 0,-18 18,-6" fill="#A84320" stroke="#66200A" stroke-width="1.2" />
            <ellipse cx="0" cy="7" rx="6.5" ry="8.5" fill="#3E2723" />
            <g transform="translate(-13, 8)">
              <ellipse cx="0" cy="0" rx="7" ry="5.5" fill="#F5BA82" />
              <circle cx="-4" cy="-5" r="4.5" fill="#F5BA82" />
              <circle cx="-5.5" cy="-6" r="1.2" fill="#3E2723" />
              <ellipse cx="1" cy="-9" rx="2" ry="4" fill="#C98A4E" transform="rotate(20)" />
            </g>
          </g>

        </svg>
      </div>
    </section>

    <!-- ===== 3. ORTA PANEL: 3D ANALOG SAAT ===== -->
    <section class="clock-stage-container">
      <div id="clock-wrapper" class="clock-3d-wrapper">
        <svg id="analog-clock" viewBox="0 0 240 240" role="img" aria-label="Analog Saat Kadranı">
          <defs>
            <linearGradient id="clockBezelGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFFFFF" />
              <stop offset="40%" stop-color="#E2E8F0" />
              <stop offset="100%" stop-color="#CBD5E1" />
            </linearGradient>

            <radialGradient id="clockFaceGrad" cx="50%" cy="50%" r="50%">
              <stop offset="85%" stop-color="#FFFFFF" />
              <stop offset="100%" stop-color="#F1F5F9" />
            </radialGradient>

            <filter id="handShadow" x="-20%" y="-20%" width="150%" height="150%">
              <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.25" />
            </filter>
          </defs>

          <!-- Dış Kasa / Bezel -->
          <circle id="clock-bezel" cx="120" cy="120" r="114" fill="url(#clockBezelGrad)" stroke="var(--bezel-border)" stroke-width="4" />
          
          <!-- Altın Rim (Streak 3) -->
          <circle id="clock-gold-rim" cx="120" cy="120" r="106" fill="none" stroke="transparent" stroke-width="4" />

          <!-- Kadran -->
          <circle cx="120" cy="120" r="104" fill="url(#clockFaceGrad)" />

          <!-- Dakika Çentikleri -->
          <g id="minute-ticks"></g>

          <!-- Gizli 5'er Dakika İpuçları -->
          <g id="minute-labels" class="minute-hint-labels" opacity="0"></g>

          <!-- 1-12 Sayıları -->
          <g id="hour-numbers" class="clock-numbers-group"></g>

          <!-- AKREP -->
          <g id="hour-hand-group" class="clock-hand" filter="url(#handShadow)">
            <line id="hour-hand" x1="120" y1="120" x2="120" y2="58" stroke="var(--hand-hour-color)" stroke-width="9" stroke-linecap="round" />
            <circle cx="120" cy="58" r="3" fill="#FFFFFF" opacity="0.85" />
          </g>

          <!-- YELKOVAN -->
          <g id="minute-hand-group" class="clock-hand" filter="url(#handShadow)">
            <line id="minute-hand" x1="120" y1="128" x2="120" y2="30" stroke="var(--hand-minute-color)" stroke-width="5.5" stroke-linecap="round" />
            <polygon points="120,22 115,34 125,34" fill="var(--hand-minute-color)" />
          </g>

          <!-- Merkez Pivot -->
          <circle cx="120" cy="120" r="8" fill="#0F172A" />
          <circle cx="120" cy="120" r="4" fill="#F8FAFC" />
        </svg>
      </div>

      <!-- Bilgi Rozetleri -->
      <div class="clock-legend">
        <span class="legend-badge hour-badge"><span class="badge-dot dot-hour"></span> Akrep (Saat)</span>
        <span class="legend-badge min-badge"><span class="badge-dot dot-min"></span> Yelkovan (Dakika)</span>
      </div>
    </section>

    <!-- ===== 4. ALT PANEL: Soru & Cevaplar (PC ve Mobilde Alt Alta) ===== -->
    <section class="question-action-card">

      <!-- Hikaye / Görev Balonu -->
      <div class="speech-bubble-container">
        <div class="mascot-avatar" id="mascot-face">🦉</div>
        <div class="speech-bubble">
          <p id="story-text" class="story-text">Günün saati yükleniyor...</p>
          <h2 id="question-text" class="question-title">Bu saat kaçı gösteriyor?</h2>
        </div>
      </div>

      <!-- Soru Tipi 1: iOS 3D Wheel Picker -->
      <div id="wheel-picker-area" class="interactive-mode-box" style="display:none">
        <div class="wheel-picker-card">
          <div class="wheel-box">
            <span class="wheel-header">SAAT (00-23)</span>
            <div class="wheel-viewport" id="hour-wheel-viewport">
              <div class="wheel-glass-highlight"></div>
              <div class="wheel-track" id="hour-wheel-track" role="listbox"></div>
            </div>
          </div>

          <div class="wheel-colon-box">
            <span class="wheel-colon">:</span>
          </div>

          <div class="wheel-box">
            <span class="wheel-header">DAKİKA (00-55)</span>
            <div class="wheel-viewport" id="minute-wheel-viewport">
              <div class="wheel-glass-highlight"></div>
              <div class="wheel-track" id="minute-wheel-track" role="listbox"></div>
            </div>
          </div>
        </div>

        <button id="submit-wheel" class="bouncy-btn btn-success" type="button">
          <span class="btn-icon">✨</span>
          <span class="btn-label">Cevabımı Kontrol Et</span>
        </button>
      </div>

      <!-- Soru Tipi 2: 4 Çoktan Seçmeli Şık -->
      <div id="multiple-choice-area" class="interactive-mode-box" style="display:none">
        <div id="choices-grid" class="choices-grid"></div>
      </div>

      <!-- Geri Bildirim & İkinci Şans Geçiş Butonu -->
      <div id="feedback-area" class="feedback-container">
        <div id="feedback-message" class="feedback-banner"></div>
        <button id="next-question-btn" class="bouncy-btn btn-primary next-btn" style="display:none" type="button">
          <span class="btn-label">Sonraki Göreve Geç</span>
          <span class="btn-icon">🚀</span>
        </button>
      </div>

    </section>

  </div>

  <script src="js/turkishTimeEngine.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
